[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "us-debt-simulator"
version = "0.2.0"
description = "Transparent quarterly simulation of U.S. federal debt dynamics and Treasury refinancing"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "U.S. Fiscal Dynamics Simulator contributors"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "plotly>=5.24,<7",
  "requests>=2.32,<3",
  "scipy>=1.14,<2",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.7,<1",
]

[project.scripts]
debt-sim-refresh = "debt_sim.data:refresh_cli"
debt-sim-validate = "debt_sim.validation:validation_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/debt_sim"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
